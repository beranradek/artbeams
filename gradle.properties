springBootVersion = 3.4.11
kotlinVersion = 2.2.0
kotestVersion = 5.9.1
kotestSpringVersion = 1.3.0
mailgunVersion = 1.1.3
mockkVersion = 1.13.14

jooqPluginVersion = 9.0
ktlintPluginVersion = 14.0.1

# The following jooqVersion must be really supported by corresponding Spring Boot version.
# Spring Boot 3.4.x supports JOOQ 3.19.x
jooqVersion = 3.19.16

postgresqlVersion = 42.7.4

jacksonVersion = 2.18.2

zxcvbnVersion = 1.9.0

openaiVersion = 4.8.0

# Resource-saving build settings: more suitable for fast release of resources
# (RAM/CPU) on less powerful build servers (e.g. a small VPS with 2 CPUs and ~4 GB RAM).
# Without the daemon each build runs in a one-off JVM that exits when the build
# finishes, instead of keeping a 300-400 MB JVM resident in the background.
# Trade-off: builds start a few seconds slower. For faster local development
# on a powerful machine, override with: ./gradlew -Dorg.gradle.daemon=true ...
org.gradle.daemon=false
org.gradle.workers.max=1

# JVM memory configuration for Gradle (a single JVM is started per build)
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=512m

# Kotlin daemon memory configuration
kotlin.daemon.jvmargs=-Xmx1g
